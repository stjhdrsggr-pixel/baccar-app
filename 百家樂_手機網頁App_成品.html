<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>百家樂快速計算</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Noto Sans TC",Arial,sans-serif;color:#171717;background:#f5f5f7}
*{box-sizing:border-box}body{margin:0;padding:18px 14px 30px}
.app{max-width:560px;margin:auto}
.card{background:#fff;border-radius:18px;padding:16px;margin-bottom:12px;box-shadow:0 2px 12px rgba(0,0,0,.06)}
h1{font-size:22px;margin:0 0 4px}.muted{color:#777;font-size:13px}
.row{display:flex;gap:10px;align-items:center}.between{justify-content:space-between}
label{display:block;font-size:14px;font-weight:700;margin-bottom:7px}
input{width:100%;height:52px;border:1px solid #ddd;border-radius:12px;padding:0 14px;font-size:20px;outline:none;background:#fafafa}
input:focus{border-color:#111;background:#fff}
button{height:50px;border:0;border-radius:12px;padding:0 18px;font-size:16px;font-weight:700;background:#111;color:white;white-space:nowrap}
button.secondary{background:#eee;color:#111}.danger{background:#fee!important;color:#a00!important}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{background:#f7f7f8;border-radius:12px;padding:12px}
.stat .v{font-size:21px;font-weight:800;margin-top:3px}
.best{font-size:32px;font-weight:900}.ev{font-size:24px;font-weight:800}
.evgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:14px}
.evbox{background:#f7f7f8;border-radius:10px;padding:10px 4px;text-align:center}.evbox .name{font-size:13px;color:#666}.evbox .num{font-size:15px;font-weight:800;margin-top:4px}
.positive{color:#087f23}.negative{color:#a00}
.note{font-size:12px;color:#777;line-height:1.5}
.hidden{display:none}
@media(max-width:390px){.evgrid{gap:4px}.evbox{padding:8px 2px}.evbox .num{font-size:13px}}
</style>
</head>
<body>
<div class="app">
  <div class="card">
    <div class="row between">
      <div><h1>百家樂｜快速計算</h1><div class="muted">一局一輸入，最多累積 60 局</div></div>
      <div class="muted">第 <b id="round">0</b>/60</div>
    </div>
  </div>

  <div class="card">
    <label for="cards">本局牌面</label>
    <div class="row">
      <input id="cards" placeholder="例如 K7/54" autocomplete="off" autocapitalize="characters" enterkeyhint="done">
      <button id="record">記錄本局</button>
    </div>
    <div id="msg" class="note" style="margin-top:8px">格式：莊/閒，例如 K7/54；T/J/Q/K 都代表 10。</div>
  </div>

  <div class="card">
    <div class="row between">
      <div><div class="muted">下一局最佳</div><div id="best" class="best">—</div></div>
      <div style="text-align:right"><div class="muted">EV</div><div id="bestEv" class="ev">—</div></div>
    </div>
    <div id="evgrid" class="evgrid"></div>
  </div>

  <div class="card">
    <div class="stats">
      <div class="stat"><div class="muted">剩餘牌</div><div id="remaining" class="v">416</div></div>
      <div class="stat"><div class="muted">狀態</div><div id="status" class="v">新靴</div></div>
    </div>
  </div>

  <div class="card">
    <label for="reset">保險清零</label>
    <div class="row">
      <input id="reset" placeholder="輸入「清零」" autocomplete="off">
      <button id="resetBtn" class="danger">清零</button>
    </div>
    <div class="note" style="margin-top:8px">換靴、洗牌或發牌中斷時使用。清零後所有累積牌況會重新開始。</div>
  </div>

  <div class="card">
    <div class="note">資料只保存在這個瀏覽器的本機儲存空間。此頁面的 EV 為輕量估計模型，不代表保證獲利。</div>
  </div>
</div>

<script>
(() => {
  const KEY='baccarat_fast_v1';
  const labels=['莊','閒','和','莊對','閒對'];
  const initial={A:32,'2':32,'3':32,'4':32,'5':32,'6':32,'7':32,'8':32,'9':32,T:32,J:32,Q:32,K:32};

  const $=id=>document.getElementById(id);
  let state=load();

  function load(){
    try{
      const x=JSON.parse(localStorage.getItem(KEY)||'null');
      return x && Array.isArray(x.history) ? x : {history:[]};
    }catch{return {history:[]}}
  }
  function save(){localStorage.setItem(KEY,JSON.stringify(state))}
  function clean(s){return s.trim().toUpperCase().replace(/\s+/g,'')}
  function valid(s){return /^[A23456789TJQK]+\/[A23456789TJQK]+$/.test(s)}
  function counts(){
    const c={}; Object.keys(initial).forEach(k=>c[k]=0);
    for(const hand of state.history){
      for(const ch of hand.replace('/','')) if(c[ch]!==undefined)c[ch]++;
    }
    return c;
  }
  function remaining(){
    const c=counts(), r={};
    for(const k in initial)r[k]=Math.max(0,initial[k]-c[k]);
    return r;
  }
  function calc(){
    const r=remaining(), total=Object.values(r).reduce((a,b)=>a+b,0);
    const high=r['7']+r['8']+r['9']+r.T+r.J+r.Q+r.K;
    const low=r.A+r['2']+r['3']+r['4']+r['5'];
    const comp=total?(high-low)/total:0;
    const tie=Math.max(.06,Math.min(.13,.09515486+.10*comp));
    const banker=Math.max(.40,Math.min(.52,.458597803+.12*comp));
    const player=Math.max(0,1-tie-banker);
    let same=0;
    for(const k in r)same+=r[k]*(r[k]-1);
    const pairRate=total>1?same/(total*(total-1)):0;
    const bp=Math.max(0,Math.min(.20,pairRate*.675));
    const pp=bp;
    return {
      total,
      ev:[
        banker*.95-player,
        player-banker,
        tie*8-(1-tie),
        bp*11-(1-bp),
        pp*11-(1-pp)
      ]
    };
  }
  function render(){
    $('round').textContent=state.history.length;
    const c=calc(); $('remaining').textContent=c.total;
    $('status').textContent=state.history.length===0?'新靴':state.history.length>=60?'已滿60局':'累積中';
    const grid=$('evgrid');grid.innerHTML='';
    c.ev.forEach((v,i)=>{
      const d=document.createElement('div');d.className='evbox';
      d.innerHTML=`<div class="name">${labels[i]}</div><div class="num ${v>0?'positive':v<0?'negative':''}">${(v*100).toFixed(2)}%</div>`;
      grid.appendChild(d);
    });
    const m=Math.max(...c.ev), idx=c.ev.indexOf(m);
    $('best').textContent=m>0?labels[idx]:'不下注';
    $('bestEv').textContent=(m*100).toFixed(2)+'%';
    $('bestEv').className='ev '+(m>0?'positive':m<0?'negative':'');
  }
  function record(){
    const v=clean($('cards').value);
    if(!valid(v)){
      $('msg').textContent='格式錯誤：請輸入例如 K7/54。';
      return;
    }
    state.history.push(v);
    if(state.history.length>=60){
      state.history=[];
      $('msg').textContent='已完成 60 局，系統已自動重置新靴。';
    }else{
      $('msg').textContent='已記錄本局，下一局會以累積牌況重新計算。';
    }
    save(); $('cards').value=''; render(); $('cards').focus();
  }
  function reset(){
    if(clean($('reset').value)!=='清零'){
      $('msg').textContent='若要重置，請輸入「清零」。';
      return;
    }
    state={history:[]};save();
    $('reset').value='';$('cards').value='';
    $('msg').textContent='已清零，重新開始新靴。';
    render();$('cards').focus();
  }
  $('record').addEventListener('click',record);
  $('cards').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();record()}});
  $('resetBtn').addEventListener('click',reset);
  $('reset').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();reset()}});
  render();
})();
</script>
</body>
</html>
